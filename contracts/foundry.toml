[profile.default]
src = "src"
test = "test"
# Foundry 1.7 treats table-prefixed getters as table tests without a path filter.
match_path = "test/*.t.sol"
script = "script"
out = "out"
libs = []
solc_version = "0.8.30"
auto_detect_solc = false
evm_version = "prague"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 512
seed = "0x70696e62616c6c"
